# Política del security gate (sección 5.2). Se ajusta aquí, sin tocar el workflow.

# Acción por severidad (ya traducida a la escala común).
# REGLA FIJA: solo CRITICAL y HIGH pueden bloquear. Si aquí se pone "bloquea"
# en otra severidad, el gate lo ignora con un warning.
acciones:
  CRITICAL: bloquea
  HIGH: bloquea
  MEDIUM: avisa        # no bloquea · va a backlog
  LOW: informa         # no bloquea
  INFO: informa        # no bloquea

# Solo bloquea lo NUEVO del PR. Un CRITICAL/HIGH preexistente avisa y va a backlog.
solo_nuevos: true

# Plazo en días para lo que va a backlog.
sla_dias:
  CRITICAL: 7          # deuda preexistente
  HIGH: 30             # deuda preexistente
  MEDIUM: 90
  LOW: 180             # LOW es "informa": el SLA no se muestra en la CLI

# Traducción de la escala de cada herramienta a CRITICAL/HIGH/MEDIUM/LOW/INFO.
# "_otro" = valor si la herramienta trae algo no listado.
severidades:
  gitleaks: CRITICAL   # no trae severidad: todo secreto es CRITICAL
  trivy:
    CRITICAL: CRITICAL
    HIGH: HIGH
    MEDIUM: MEDIUM
    LOW: LOW
    _otro: MEDIUM      # UNKNOWN
  semgrep:
    ERROR: HIGH
    WARNING: MEDIUM
    INFO: INFO
    _otro: MEDIUM
  bandit:
    HIGH: HIGH
    MEDIUM: MEDIUM
    LOW: LOW
    _otro: INFO        # UNDEFINED
  pip-audit: MEDIUM    # no trae severidad: se usa la de Trivy para el mismo CVE; si Trivy no lo vio, este valor
  ruff:
    severidad: LOW                 # calidad
    logica_severidad: MEDIUM       # reglas que indican un bug real
    logica_prefijos: [F821, F822, F823, F632, E9, PLE]

  # ── Go ──────────────────────────────────────────────────────────────────
  gosec:
    HIGH: HIGH
    MEDIUM: MEDIUM
    LOW: LOW
    _otro: MEDIUM
  govulncheck: MEDIUM  # no trae severidad: se usa la de Trivy para el mismo CVE; si Trivy no lo vio, este valor
  staticcheck:
    severidad: LOW                 # calidad (S*, ST*, QF*, U1000)
    logica_severidad: MEDIUM       # SA* = bugs reales; compile = el código no compila
    logica_prefijos: [SA, compile]

  # ── Node (JS backend) ───────────────────────────────────────────────────
  osv-scanner: MEDIUM  # no trae severidad: se usa la de Trivy para el mismo CVE; si Trivy no lo vio, este valor
  eslint:
    seguridad:                     # reglas security/*: severidad según la config versionada de scan-node
      ERROR: HIGH                  # "error" = reglas de alta señal (eval, child_process, require dinámico…)
      WARNING: MEDIUM              # "warn"  = reglas más ruidosas
      _otro: MEDIUM
    severidad: LOW                 # resto de reglas = calidad
    logica_severidad: MEDIUM       # reglas que indican un bug real
    logica_reglas: [parse-error, no-undef, no-unreachable, no-dupe-keys, no-dupe-else-if, no-duplicate-case,
                    no-self-compare, no-self-assign, no-constant-condition, no-constant-binary-expression,
                    no-unsafe-finally, no-unsafe-negation, no-unsafe-optional-chaining, no-func-assign,
                    no-const-assign, no-cond-assign, no-compare-neg-zero, use-isnan, valid-typeof,
                    getter-return, no-setter-return, no-dupe-class-members, no-import-assign,
                    constructor-super, no-this-before-super, no-class-assign,
                    # TypeScript (scan-ts, sin type-checking): solo las que indican un bug real.
                    # El resto de @typescript-eslint/* (no-explicit-any, no-unused-vars…) = calidad.
                    "@typescript-eslint/no-duplicate-enum-values", "@typescript-eslint/no-misused-new",
                    "@typescript-eslint/no-unsafe-declaration-merging",
                    "@typescript-eslint/no-non-null-asserted-optional-chain",
                    "@typescript-eslint/no-extra-non-null-assertion"]
