# Ruleset Semgrep FIJO y versionado en el repo (no se descarga del registro).
rules:
  - id: lab.js.eval-injection
    languages: [javascript]
    severity: ERROR
    message: >
      eval / new Function / vm con un valor no literal: si el valor viene de afuera,
      se ejecuta código arbitrario. Usa JSON.parse o un parser/lista permitida.
    metadata:
      category: security
      cwe: "CWE-95: Eval Injection"
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
          - pattern: Function(..., $X)
          - patterns:
              - pattern-either:
                  - pattern: require("vm").$RUN($X, ...)
                  - patterns:
                      - pattern-inside: |
                          $VM = require("vm");
                          ...
                      - pattern: $VM.$RUN($X, ...)
              - metavariable-regex:
                  metavariable: $RUN
                  regex: ^(runInNewContext|runInThisContext|runInContext|compileFunction)$
              - pattern-not: $OBJ.$RUN("...", ...)
      - pattern-not: eval("...")
      - pattern-not: new Function(..., "...")
      - pattern-not: Function(..., "...")

  - id: lab.js.command-injection
    languages: [javascript]
    severity: ERROR
    message: >
      child_process.exec/execSync con un comando no literal: pasa por una shell y
      permite inyectar comandos. Usa execFile/spawn con una lista de argumentos fija.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern: require("child_process").$F($CMD, ...)
          - patterns:
              - pattern-inside: |
                  $CP = require("child_process");
                  ...
              - pattern: $CP.$F($CMD, ...)
          - patterns:
              - pattern-inside: |
                  const { ..., $F, ... } = require("child_process");
                  ...
              - pattern: $F($CMD, ...)
          - patterns:
              - pattern-inside: |
                  import { ..., $F, ... } from "child_process";
                  ...
              - pattern: $F($CMD, ...)
          - patterns:
              - pattern-inside: |
                  import * as $CP from "child_process";
                  ...
              - pattern: $CP.$F($CMD, ...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(exec|execSync)$
      - pattern-not: $FN("...", ...)
      - pattern-not: $OBJ.$FN("...", ...)
