# Orquestador del pipeline de seguridad (laboratorio).
# NO contiene lógica de escáneres: detecta lenguajes, invoca módulos y llama al gate.
# Solo el job security-gate puede hacer fallar el pipeline.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"            # 01:00 hora Colombia (UTC-5) — Gitleaks con historial completo
  workflow_dispatch:
    inputs:
      languages:
        description: 'auto | lista exacta "python,go" | ajustes "+go,-node"'
        required: false
        default: auto
      tratar_todo_como_nuevo:
        description: "Solo laboratorio: tratar todo hallazgo como nuevo (para probar el bloqueo sin PR)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read                   # solo el job security-gate recibe pull-requests: write

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.langs.outputs.python }}
      go: ${{ steps.langs.outputs.go }}
      node: ${{ steps.langs.outputs.node }}
      markers: ${{ steps.langs.outputs.markers }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: langs
        uses: ./.github/actions/detect-languages
        with:
          languages: ${{ inputs.languages || 'auto' }}

  scan-common:                     # SIEMPRE; no depende de detect
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true        # un escáner nunca tumba el pipeline
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0           # Gitleaks necesita historial (BASE..HEAD o completo)
          persist-credentials: false
      - uses: ./.github/actions/scan-common

  scan-python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/scan-python

  # scan-go / scan-node: siguiente fase (mismo patrón, if: needs.detect.outputs.<lang> == 'true')

  security-gate:
    # Único job que puede hacer fallar el pipeline (sin continue-on-error).
    # Solo bloquean hallazgos CRITICAL/HIGH nuevos; MEDIUM/LOW/INFO se informan.
    needs: [detect, scan-common, scan-python]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write         # comentario del gate en el PR
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0           # diff del PR + git blame para "Nuevo: Sí (commit …)"
          persist-credentials: false
      - uses: ./.github/actions/security-gate
        with:
          mode: ${{ vars.SECURITY_GATE_MODE || 'enforce' }}
          markers: ${{ needs.detect.outputs.markers }}
          expected-modules: ${{ needs.detect.outputs.python == 'true' && 'scan-common scan-python' || 'scan-common' }}
          treat-all-as-new: ${{ inputs.tratar_todo_como_nuevo == true && 'true' || 'false' }}
